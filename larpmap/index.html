<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8">
    <title>LARP Mapper</title>

	<!-- Mobile Specific Metas –––––––––––––––––––––––––––––––––––––––––––––––––– -->
	<meta name="viewport" content="width=device-width, initial-scale=1">

	<!-- FONT –––––––––––––––––––––––––––––––––––––––––––––––––– -->
	<link href="//fonts.googleapis.com/css?family=Raleway:400,300,600" rel="stylesheet" type="text/css">

	<!-- CSS –––––––––––––––––––––––––––––––––––––––––––––––––– -->
	<link rel="stylesheet" href="css/normalize.css">
	<link rel="stylesheet" href="css/skeleton.css">

	<!-- Favicon ––––––––––––––––––––––––––––––––––––––––––––––––– -->
	<link rel="icon" type="image/png" href="images/icons/launchericon-48x48.png">
	<meta charset="UTF-8">
    <meta name="theme-color" content="#000000" />

	<!-- PWA manifest ––––––––––––––––––––––––––––––––––––––––––––––––– -->
	<link rel="manifest" href="manifest.json" />

</head>
<body>
	<script src="js/app.js"></script>
	<script src="js/tabs.js"></script>
	<div class="container">
		<div class="row">
			<div class="twelve columns" style="margin-top: 5%">
				<div class="tab">
					<button class="tablinks" onclick="openTab(event, 'DocumentsTab')" id="defaultOpen">Documents</button>
					<button class="tablinks" onclick="openTab(event, 'MapTab')">Map</button>
					<button class="tablinks" onclick="openTab(event, 'SettingsTab')">Settings</button>
				</div>
			</div>
		</div>
		<div id="DocumentsTab" class="tabcontent">
			<div class="row">
				<div class="twelve columns">
					<h1>Documents</h1>
				</div>
			</div>
			<div class="row">
				<div class="twelve columns" height="100%">
					<embed src="docs/LoremGibson.pdf" type="application/pdf" width="100%" height="100%" />
				</div>
			</div>
			<div class="row">
				<div class="twelve columns" height="100%">
					<iframe src="docs/LoremGibson.htm" title="Lorem Gibson" width="100%" height="800" style="border:1px solid black;" ></iframe>
				</div>
			</div>
			<div class="row">
				<div class="twelve columns" height="100%">
					<embed src="docs/LoremGibson.txt" type="text/plain" width="100%" height="100%" />
				</div>
			</div>
		</div>
		<div id="MapTab" class="tabcontent">
			<div class="row">
				<div class="twelve columns">
					<h1>Map</h1>
				</div>
			</div>
		</div>
		<div id="SettingsTab" class="tabcontent">
			<div class="row">
				<div class="twelve columns">
					<h1>Settings</h1>
				</div>
			</div>
		</div>
	</div>
</body>
<script>
// Get the element with id="defaultOpen" and click on it
document.getElementById("defaultOpen").click();
</script>
</html>
