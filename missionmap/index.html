<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8">
    <title>Mission Map</title>

	<!-- Mobile Specific Metas –––––––––––––––––––––––––––––––––––––––––––––––––– -->
	<meta name="viewport" content="width=device-width, initial-scale=1">

	<!-- FONT –––––––––––––––––––––––––––––––––––––––––––––––––– -->
	<link href="//fonts.googleapis.com/css?family=Raleway:400,300,600" rel="stylesheet" type="text/css">

	<!-- CSS –––––––––––––––––––––––––––––––––––––––––––––––––– -->
	<link rel="stylesheet" href="css/normalize.css">
	<link rel="stylesheet" href="css/skeleton.css">
	<link rel="stylesheet" href="css/map.css">

	<!-- Favicon ––––––––––––––––––––––––––––––––––––––––––––––––– -->
	<link rel="icon" type="image/png" href="images/icons/launchericon-48x48.png">
	<meta charset="UTF-8">
    <meta name="theme-color" content="#000000" />

	<!-- PWA manifest ––––––––––––––––––––––––––––––––––––––––––––––––– -->
	<link rel="manifest" href="manifest.json" />

</head>
<body>
	<script type="text/javascript" src="js/app.js"></script>
	<script type="text/javascript" src="js/tabs.js"></script>
	<script type="text/javascript" src="js/logging.js"></script>
	<script type="text/javascript" src="js/indexdb.js"></script>
	<div class="container">
		<div class="row">
			<div class="tab">
				<div class="three columns" style="margin-top: 5%">
					<button class="tablinks u-full-width" onclick="clickButton1();" id="documentsButton">Documents</button>
				</div>
				<div class="three columns" style="margin-top: 5%">
					<button class="tablinks u-full-width" onclick="clickButton2();" id="mapButton">Map</button>
				</div>
				<div class="three columns" style="margin-top: 5%">
					<button class="tablinks u-full-width" onclick="clickButton3();" id="settingsButton">Settings</button>
				</div>
				<div class="three columns" style="margin-top: 5%">
					<button class="tablinks u-full-width" onclick="clickButton4();" id="adminButton" style="display:none;">Admin</button>
				</div>
			</div>
		</div>
		<div id="DocumentsTab" class="tabcontent">
			<div class="row">
				<div class="twelve columns" height="100%">
					<!--
						<iframe src="docs/LoremGibson.htm" title="Lorem Gibson" width="100%" height="800" frameborder="0" style="border:1px solid black;" ></iframe>
					-->
					<iframe src="docs/B83stats.htm" title="Lorem Gibson" width="100%" height="800" frameborder="0" style="border:1px solid black;" ></iframe>
				</div>
			</div>
		</div>
		<div id="MapTab" class="tabcontent">
			<div class="row">
				<div class="twelve columns" height="100%">
					<div id="map">
						<!--
						<img src="docs/Basic_Park_map.jpg" style="width: 100%;height: 100%;object-fit: contain;">
						-->
					</div>
				</div>
			</div>
		</div>
		<div id="SettingsTab" class="tabcontent">
			<div class="row">
				<div class="twelve columns">
					<h2>General</h2>
				</div>
			</div>
			<div class="row">
				<div class="twelve columns">
					<label class="darkmode_label">
						<input type="checkbox" id="darkmode" name="darkmode" onchange="changeDarkMode()">
						<span class="label-body">Dark mode</span>
					</label>
				</div>
			</div>
			<div class="row">
				<div class="twelve columns">
					<label class="darkmode_label">
						<input type="checkbox" id="wakelock" name="wakelock" onchange="changeWakeLock()">
						<span class="label-body">Keep screen awake</span>
					</label>
				</div>
			</div>
			<div class="row">
				<div class="twelve columns">
					<h2>Map</h2>
				</div>
			</div>
			<div class="row">
				<div class="twelve columns">
					<label class="rotate_label">
						<input type="checkbox" id="rotate" name="rotate" onchange="changeRotate()">
						<span class="label-body">Rotate to match direction of travel</span>
					</label>
				</div>
			</div>
			<div class="row">
				<div class="twelve columns">
					<label class="follow_label">
						<input type="checkbox" id="follow" name="follow" onchange="changeFollow()">
						<span class="label-body">Follow current position</span>
					</label>
				</div>
			</div>
			<div class="row">
				<div class="twelve columns">
					<h2>Admin access</h2>
				</div>
			</div>
			<div class="row">
				<div class="twelve columns">
					<label class="adminpassword_label">
						<input type="password" id="adminpassword" onchange="checkAdminPassword()">
						<span class="label-body">Enter password for admin access (this is out-of-character for GMs)</span>
					</label>
				</div>
			</div>
		</div>
		<div id="AdminTab" class="tabcontent">
			<div class="row">
				<div class="twelve columns" height="100%">
					<h2>Scenario</h2>
				</div>
			</div>
			<div class="row">
				<div class="twelve columns" height="100%">
					<label for="scenario">Choose the scenario</label>
					<select id="scenario" name="scenario">
						<option value="0">Scenario 1</option>
						<option value="1">Scenario 2</option>
					</select>
				</div>
			</div>
			<div class="row">
				<div class="twelve columns" height="100%">
					<h2>Map method</h2>
				</div>
			</div>
			<div class="row">
				<div class="twelve columns" height="100%">
					<label for="mapMethod">How to embed the map</label>
					<select id="mapMethod" name="mapMethod">
						<option value="0">Simple iframe embed</option>
						<option value="1">Javascript API insert</option>
					</select>
				</div>
			</div>
			<div class="row">
				<div class="twelve columns" height="100%">
					<button class="button-primary u-full-width" onclick="saveSettings();">Save</button>
				</div>
			</div>
			<div class="row">
				<div class="twelve columns" height="100%">
					<h2>App log</h2>
				</div>
			</div>
			<div class="row">
				<div class="twelve columns" height="400">
					<div id="mission-map-log"></div>
				</div>
			</div>
		</div>
	</div>
</body>
<script>
// Get the element with id="documentsButton" and click on it
document.getElementById("documentsButton").click();
</script>

<script type="text/javascript" src="https://maps.googleapis.com/maps/api/js?key=AIzaSyAUNxj5qu6Y2e6mWH-p55IOn9-r6pH_jHk&loading=async&callback=initMap&libraries=marker" defer></script>
<script type="text/javascript" src="js/map.js"></script>
</html>
